name: Feature request
description: An idea or a change you would like to make
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the wish, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Firmware, Orb Manager, Theme Editor, Apps / SDK, Docs, Not sure]
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
