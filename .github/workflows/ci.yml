# Every check that needs no board, on every pull request and every push to main. The
# same targets run locally: `make check` at the repo root runs them all after an
# `idf.py build` (BUILDING.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: apps and SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2          # make_factory_apps compares the shelf against HEAD
      # The shelf check is byte-for-byte, and a different clang emits a different module,
      # so CI builds with the clang the shelf was baked with (BUILDING.md: clang 21).
      - name: Toolchain (clang 21)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y lld-21
          echo "ORB_CLANG=/usr/lib/llvm-21/bin/clang" >> "$GITHUB_ENV"
      - run: make check-apps
      - name: SDK tarball builds a fresh app
        run: |
          make sdk
          v=$(cat version.txt)
          mkdir -p /tmp/sdk && tar -xzf build/orb-sdk-$v.tar.gz -C /tmp/sdk
          cd /tmp && python3 /tmp/sdk/orb-sdk-$v/orbsdk.py new hello
          cd hello && make SDK=/tmp/sdk/orb-sdk-$v
          python3 /tmp/sdk/orb-sdk-$v/orbsdk.py inspect build/hello.orbapp

  hub:
    name: orb-manager
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/orb-manager/go.mod
          cache-dependency-path: tools/orb-manager/go.sum
      - run: make check-hub

  editor:
    name: theme editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y python3-pil python3-numpy
      - run: make check-editor

  # The firmware build and the host suites share one job, because the suites need what
  # only a configured firmware tree has: build/config/sdkconfig.h (host_idle_dim pins the
  # shipped ceiling from it) and ESP-IDF's own NVS generator (host_layout_carry checks the
  # carry against the real format). host_orbapp_install re-runs the shelf check, so it
  # needs the shelf's clang, as the apps job does.
  firmware:
    name: firmware build and host suites
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the image's version stamp carries the commit SHA
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/gorb-os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
      - name: Host toolchain (gcc, clang 21, Pillow, NumPy)
        shell: bash
        run: |
          apt-get update && apt-get install -y gcc wget lsb-release software-properties-common gnupg
          wget -qO- https://apt.llvm.org/llvm.sh | bash -s -- 21
          apt-get install -y lld-21
          . "$IDF_PATH/export.sh"
          python3 -m pip install pillow numpy
      - name: Host suites
        shell: bash
        env:
          ORB_CLANG: /usr/lib/llvm-21/bin/clang
        run: |
          . "$IDF_PATH/export.sh"
          make check-host
