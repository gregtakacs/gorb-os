# Every check that needs no board, on every pull request and every push to main. The
# same targets run locally: `make check` at the repo root runs the first four jobs, and
# `idf.py build` is the fifth (BUILDING.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # orb_version.sh's self-test builds stamps from git
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc python3-pil python3-numpy
      - run: make check-host

  apps:
    name: apps and SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2          # make_factory_apps compares the shelf against HEAD
      # The shelf check is byte-for-byte, and a different clang emits a different module,
      # so CI builds with the clang the shelf was baked with (BUILDING.md: clang 21).
      - name: Toolchain (clang 21)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y lld-21
          echo "ORB_CLANG=/usr/lib/llvm-21/bin/clang" >> "$GITHUB_ENV"
      - run: make check-apps
      - name: SDK tarball builds a fresh app
        run: |
          make sdk
          v=$(cat version.txt)
          mkdir -p /tmp/sdk && tar -xzf build/orb-sdk-$v.tar.gz -C /tmp/sdk
          cd /tmp && python3 /tmp/sdk/orb-sdk-$v/orbsdk.py new hello
          cd hello && make SDK=/tmp/sdk/orb-sdk-$v
          python3 /tmp/sdk/orb-sdk-$v/orbsdk.py inspect build/hello.orbapp

  hub:
    name: orb-manager
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/orb-manager/go.mod
          cache-dependency-path: tools/orb-manager/go.sum
      - run: make check-hub

  editor:
    name: theme editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y python3-pil python3-numpy
      - run: make check-editor

  firmware:
    name: firmware build
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the image's version stamp carries the commit SHA
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/gorb-os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
