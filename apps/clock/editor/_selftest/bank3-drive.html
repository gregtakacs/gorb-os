<!doctype html>
<meta charset="utf-8">
<title>bank3-drive</title>
<body><pre id="out">booting…</pre>
<!-- Drives the composer's REAL export path (exportTheme3 → t3bake) for one preset and prints
     the bytes the bake downloads, so the bank policy, the D34 tripwire and the art cap all run
     over real Chrome pixels instead of a hand-assembled plane set. bake3-test.html bakes a
     still on its own planes; a shipped dial needs what the button ships: plate.frames when
     splitPolicy3 says 'bank'. This page never re-decides that. Run it as bake3-test runs:

       chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=240000 \
         --dump-dom 'file://<abs-path>/_selftest/bank3-drive.html' > /tmp/bank3_dom.html

     `B64:` carries the whole download blob; the status names the carrier and art meter. -->
<!-- the editor's own font sheets: a bake in the fallback face is not the theme the editor makes -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Bodoni+Moda:ital,wght@0,500;0,700;1,600&family=Jost:ital,wght@0,500;0,600;0,700;1,600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Serif+Display&family=Bebas+Neue&family=Michroma&family=Audiowide&family=Bungee&family=Bungee+Shade&family=Monoton&family=Righteous&family=Rubik+Mono+One&family=Major+Mono+Display&family=Silkscreen&family=Press+Start+2P&family=Shrikhand&family=Lobster&family=Pacifico&family=Black+Ops+One&family=Rampart+One&family=Rubik+Glitch&family=UnifrakturMaguntia&family=Creepster&family=VT323&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..900&display=swap" rel="stylesheet">
<script src="../dial-renderer.js"></script>
<script src="../watch-engine.js"></script>
<!-- the dial's sounds ride the bake (D39 sndBake); without the engine it bakes silence, which
     is how every shipped Skeleton up to clock v1.2.16 left its classic tick and chimes behind -->
<script src="../sound-engine.js"></script>
<script>window.React = { createRef: () => ({ current: null }) };
// ?appv=vX.Y.Z stamps the designs this bake writes as the packaged clock would (make_clock_region's window.__ORB_APP)
(function () { const v = new URLSearchParams(location.search).get('appv'); if (v) window.__ORB_APP = { slug: 'clock', version: v }; })();</script>
<script src="../orbtheme-baker.js"></script>
<script src="../send.js"></script>
<script src="../session.js"></script>
<script src="../preview.js"></script>
<script src="../measure.js"></script>
<script src="../clock-logic.js"></script>
<script>
(function () {
  const out = document.getElementById('out'), L = [];
  const say = (s) => { L.push(s); out.textContent = L.join('\n'); };
  const E = window.WatchEngine, G = window.GorbBake;
  const DCLogic = function () { };
  DCLogic.prototype.setState = function (p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); };
  let fails = 0;
  const ok = (n, c, x) => { say((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined ? '  [' + x + ']' : '')); if (!c) fails++; };

  const IT = new (window.ClockLogic(DCLogic))({});
  IT.forceUpdate = () => { };
  // The D34 tripwire prices the walk against gt.length: a loop with frames still arriving
  // reads as zero motion. The button bakes with the ticker running, so the ticker runs here.
  IT.state.playing = true; IT.state.hidden = {}; IT.state.tab = 'export';
  let tick = 0;
  const pump = () => { stopPump(); tick = setInterval(() => IT.componentDidUpdate(), 40); };
  const stopPump = () => clearInterval(tick);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const settle = async () => {
    for (let i = 0; i < 400; i++) {
      IT.componentDidUpdate();
      if (!IT.rendering && IT._mk === IT.mvKey() && IT.gt.length === IT.B && IT.gt[0]) return true;
      await wait(40);
    }
    return false;
  };
  const mount = async (id) => {
    const P = E.PRESETS[id];
    IT.state.dial = id; IT.faces = {}; IT.base = null; IT.gt = []; IT.buildId = (IT.buildId || 0) + 1;
    IT.state.designs = {}; IT.state.designs[id] = E.canonDesign(JSON.parse(JSON.stringify(P.design)));
    IT.state.hands = 'auto'; IT.state.handFinish = 'auto';
    // What the composer's "Reset everything" on this preset sets, so the bake is the preset
    // as the app shows it. Without the train a caged preset (kitetour, orbital, opentour)
    // baked on the classic train: no cage, no carriage row, no seconds indication at all.
    IT.state.cfg = { ...(P.cfg || {}) }; IT.state.train = P.train || 'classic';
    IT.state.caseStyle = P.caseStyle || 'polished'; IT.state.caseMetal = P.caseMetal || 'auto';
    IT.state.glassStyle = P.glassStyle || 'domed';
    pump();
    IT.buildMovement();
    if (!await settle()) throw new Error(id + ' never settled (rendering=' + IT.rendering + ' gt=' + IT.gt.length + ' B=' + IT.B + ')');
  };

  const DIAL = (location.search.match(/dial=([\w-]+)/) || [])[1] || 'skeleton';
  // URLSearchParams decodes %20: the old /name=([\w -]+)/ stopped at the first encoded
  // space, so "Kite tourbillon" baked as "Kite" and filed under another card stem.
  const NAME = new URLSearchParams(location.search).get('name') || (E.PRESETS[DIAL] || {}).name || DIAL;

  async function main() {
    if (!E || !E.PRESETS || !E.PRESETS[DIAL]) throw new Error('no preset ' + DIAL);
    if (!G || !G.bakeClock3) throw new Error('orbtheme-baker.js did not load beside the page');
    IT.state.themeName = NAME;
    // every typeface the editor offers, loaded before anything is drawn: canvas text in a face
    // that has not arrived falls back silently, and the bake would ship the fallback
    const fams = Array.from(new Set(Object.values(E.FONTS || {}).map((f) => (String(f[1] || '').match(/"([^"]+)"/) || [])[1]).filter(Boolean)));
    await Promise.race([Promise.all(fams.flatMap((f) => ['400', '700', 'italic 400', 'italic 700'].map((w) => document.fonts.load(w + ' 32px "' + f + '"').catch(() => null)))),
      new Promise((r) => setTimeout(r, 20000))]);
    const missing = fams.filter((f) => !document.fonts.check('700 32px "' + f + '"'));
    say('fonts: ' + (fams.length - missing.length) + ' of ' + fams.length + ' loaded' + (missing.length ? ' \u2014 missing ' + missing.join(', ') : ''));
    // anything thrown outside the awaited chain (a timer, a frame callback) is reported, not lost
    window.addEventListener('error', (ev) => say('PAGEERR ' + ev.message + ' @ ' + (ev.filename || '').split('/').pop() + ':' + ev.lineno));
    window.addEventListener('unhandledrejection', (ev) => say('PAGEERR (promise) ' + ((ev.reason && ev.reason.stack) || ev.reason)));
    await IT.componentDidMount();
    await mount(DIAL);
    // ?favour=sweep|balanced|gears, ?plan=G/H (§49.15): the Hands tab's two plan controls, set
    // the way the composer writes them. ?tempo=N pins the gear tempo outright (the emulator's
    // forceWant), so a bench can bake a plan the frontier does not offer and watch it fail.
    const QP = new URLSearchParams(location.search);
    IT._liveDebug = QP.get('livedebug') === '1';
    if (QP.get('favour')) IT.state.cfg.favour = QP.get('favour');
    if (QP.get('plan')) IT.state.cfg.plan = QP.get('plan');
    const FT = +QP.get('tempo') || 0;
    if (FT) {
      const b0 = IT.budget.bind(IT);
      IT.budget = (fw) => Object.assign(b0(fw), { fps: FT, plan: null });   // the tempo outright: no ladder, no plan
      G.pickPlan4 = () => null;                                              // and no re-time to the calculator's pick
      IT.buildMovement();
      if (!await settle()) throw new Error('did not settle at the pinned tempo ' + FT);
      say('tempo pinned at ' + FT + ' fps: bank ' + IT.B + ' frames');
    }
    // ?lift=<comp id> (D43 P4b): lift that sub-dial face to the top of the live band —
    // over every hand — the way the stack panel writes it, before the real export runs.
    const LIFT = new URLSearchParams(location.search).get('lift');
    if (LIFT) {
      const ord = IT.face().handOrder.concat(['comp:' + LIFT]);
      IT.state.designs[DIAL].order = ord; IT.faces = {};
      say('lifted ' + LIFT + ' over the hands: order ' + ord.join(','));
      IT.buildMovement();
      if (!await settle()) throw new Error('did not settle after the lift');
    }
    // D43 P5e: the owner's Gold check edits the mounted design before the export the same way
    // ?lift= does. add/set/order take a URL-encoded JSON payload, rebuild and settle, and the
    // bake then reads the turning wheel under the lifted face. Applied in the order add, set, order.
    const reDrive = async (name, fn) => {
      const d1 = IT.design(); fn(d1); IT.state.designs[DIAL] = d1; IT.faces = {};
      IT.buildMovement();
      if (!await settle()) throw new Error('did not settle after the ' + name);
    };
    const ADD = QP.get('add');
    if (ADD) {
      const added = JSON.parse(ADD);
      await reDrive('add', (d1) => {
        added.forEach((c) => {
          if (c.after != null) { const at = d1.comps.findIndex((x) => String(x.id) === String(c.after)); delete c.after; d1.comps.splice(at + 1, 0, c); }
          else d1.comps.push(c);
        });
      });
      say('added ' + added.map((c) => c.id).join(','));
    }
    const SET = QP.get('set');
    if (SET) {
      const sets = JSON.parse(SET);
      await reDrive('set', (d1) => {
        Object.keys(sets).forEach((id) => { const c = d1.comps.find((x) => String(x.id) === String(id)); if (c) Object.assign(c, sets[id]); });
      });
      say('set ' + Object.keys(sets).join(','));
    }
    const ORDER = QP.get('order');
    if (ORDER) {
      await reDrive('order', (d1) => { d1.order = ORDER.split(',').map((s) => s.trim()).filter(Boolean); });
      say('order ' + ORDER);
    }
    // ?overlay=#rrggbb (§64.9): put the owner's OS-overlay colour on the mounted design, so a
    // shelf bake carries that colour instead of the look's accent. canonDesign keeps it only as a
    // hex, so the driver's bake and the editor's bake agree on what a half-typed value means.
    const OVL = QP.get('overlay');
    if (OVL) {
      await reDrive('overlay', (d1) => { d1.overlay = OVL; });
      say('overlay ' + OVL);
    }
    // ?strip=<type>: take every part of that type off the design first (strip=hand: a dial with no hands)
    const STRIP = QP.get('strip');
    if (STRIP) {
      const d0 = IT.design(); d0.comps = d0.comps.filter((c) => c.type !== STRIP); IT.state.designs[DIAL] = d0; IT.faces = {};
      say('stripped every ' + STRIP + ': ' + d0.comps.length + ' parts left');
      IT.buildMovement();
      if (!await settle()) throw new Error('did not settle after the strip');
    }
    // Intercept the download rather than clicking an <a>: headless Chrome has no save dir.
    // Export asks a Save dialog where the browser has one (E7 Stage 1, OrbTheme.saveFile),
    // and headless Chrome never answers it: on a virtual clock the bake waits forever. The
    // ticker runs through the bake the way it runs under a live button press: settled3()
    // prices the walk against a half-filled loop, and the D34 tripwire says so in words.
    let blob = null, fname = null;
    IT.download = (b, n) => { blob = b; fname = n; };
    IT.saveFile = async (b, n) => { blob = b; fname = n; return 'downloaded'; };
    // ?plate=1 (D43 P0): also print the plate exactly as bakeClock3 received it — 8-bit
    // RGBA before any RGB565 quantization — so the stored bytes and the glass can be
    // measured against the pixels the composer drew. Keyframe 0 when the plate is a bank.
    let plate8 = null;
    const wantPlate = /[?&]plate=1/.test(location.search), noDither = /[?&]nodither=1/.test(location.search);
    if (wantPlate || noDither) {
      // ?nodither=1 (D43 P2): bake with o.dither === false, the truncating bake, so the
      // same preset can go on the glass both ways and be grabbed side by side.
      const real = G.bakeClock3;
      G.bakeClock3 = (o) => {
        if (wantPlate) { const p = o.plate.frames ? o.plate.frames[0] : o.plate; plate8 = { w: p.w, h: p.h, rgba: p.rgba.slice() }; }
        return real(noDither ? Object.assign({}, o, { dither: false }) : o);
      };
    }
    // §49.15: the live price, before any bake — the plans the Hands tab shows while editing
    // until the live price settles: priced, and priced again at the tempo its own plan picked
    for (let i = 0, k = null; i < 900; i++) {
      IT.componentDidUpdate(); await wait(100);
      if (IT._plan4 && IT._plan4.live && IT._liveKey === IT.live4Key() && !IT._liveBusy && !IT._livePending) { if (k === IT._liveKey) break; k = IT._liveKey; }
    }
    say('LIVEHIST ' + JSON.stringify(IT._liveHist || []));
    const why4 = (e) => e.policy.filter((x) => !x.ok && x.gears && /fit|leave|landing/.test(x.why)).slice(0, 3).map((x) => G.planKey4(x) + ': ' + x.why + (x.terms ? ' ' + JSON.stringify(x.terms) : ''));
    say('LIVE4 ' + (IT._plan4 && IT._plan4.live ? JSON.stringify({ plans: IT._plan4.est.plans.map(G.planKey4), tempo: IT.F, rect_kpx: IT._plan4.est.rect_kpx, movers: IT._plan4.est.movers, why: why4(IT._plan4.est) }) : 'none' + (IT._plan4Err ? ' — ' + String(IT._plan4Err).split('\n')[0] : '')));
    // what the editor says once that price is in: the badge's rate, and whether it still waits
    { const b = IT.budget(); say('BADGE ' + JSON.stringify({ pricing: !!b.pricing, planned: !!b.dev.planned, hands: b.dev.pace, gears: b.dev.gears || 0, settled: !!IT.settled3() })); }
    say('--- baking ' + DIAL + ' (theme name "' + NAME + '") through exportTheme3 ---');
    pump();
    await wait(400);   // let the ticker fill the loop before the first settle check
    // A ticker tick landing between the comp pass and the walk re-keys the movement — the
    // race the product's "press again" sentence describes. The driver presses again.
    for (let attempt = 0; attempt < 5; attempt++) {
      await IT.exportTheme3();
      if (!/not settled|rebuilt itself/.test(String(IT.state.status || ''))) break;
      await wait(300);
    }
    const st = String(IT.state.status || '');
    if (IT._plan4 && !/^Downloaded/.test(st)) {
      const b = IT.budget(), k = IT.artKey(IT.mvKey(1));
      say('PLAN4DBG key ' + (IT._plan4.ak === k ? 'matches' : 'MOVED') + ' tick ' + IT._plan4.tick + '/' + IT.cfg().tick + ' fps ' + b.fps + ' plan ' + (b.plan ? G.planKey4(b.plan) : '-') +
          ' B ' + IT.B + ' gt ' + IT.gt.length + ' rendering ' + !!IT.rendering + ' mk ' + (IT._mk === IT.mvKey() ? 'ok' : 'stale') +
          ' bp ' + IT._bp + ' bk ' + (IT._bk === IT.artKey() + '|' + IT.cfg().tick + (b.plan ? '|' + G.planKey4(b.plan) : '') ? 'same' : 'other') + ' buildId ' + IT.buildId);
      if (IT._plan4.ak !== k) { const a = IT._plan4.ak, n = Math.min(a.length, k.length); let i = 0; while (i < n && a[i] === k[i]) i++; say('PLAN4DBG differs at ' + i + ': ' + a.slice(Math.max(0, i - 60), i + 80) + '  vs  ' + k.slice(Math.max(0, i - 60), i + 80)); }
    }
    if (IT._plan4Err) say('PLAN4ERR ' + String(IT._plan4Err).replace(/\n/g, ' | ').slice(0, 400));
    if (IT._plan4 && G.planKey4) {
      const e4 = IT._plan4.est;
      say('PLAN4WHY ' + JSON.stringify({ rect_kpx: e4.rect_kpx, movers: e4.movers, why: e4.policy.filter((x) => !x.ok && x.gears && /fit|leave|landing/.test(x.why)).slice(0, 3).map((x) => G.planKey4(x) + ': ' + x.why + (x.terms ? ' ' + JSON.stringify(x.terms) : '')) }));
      say('PLAN4 ' + JSON.stringify({ mode: e4.hand_mode, plans: e4.plans.map(G.planKey4), picks: e4.picks && Object.fromEntries(Object.entries(e4.picks).map(([k, v]) => [k, G.planKey4(v)])),
        shipped: IT._plan4Shipped ? G.planKey4(IT._plan4Shipped) : null, tempo: IT.F, bank: IT.B }));
    }
    stopPump();
    say('status: ' + st.slice(0, 200));
    ok('the bake downloaded a file', !!blob && !!fname, fname || st.slice(0, 120));
    // The status sentence is the carrier's own words (splitPolicy3's `sentence`), and it
    // never contained the literal 'FORMAT 3' the first version of this line demanded — it
    // reads 'plate keyframe bank: 8 of 8 frames at 4 fps, ...'. Assert the download it is:
    // a completed .orbtheme named by its card stem. The carrier itself is priced off the
    // bytes below, where it is a number rather than a phrase.
    ok('the status names a completed .orbtheme bake', /^Downloaded \S+\.orbtheme — /.test(st), st.slice(0, 90));
    if (!blob) { say('RESULT: FAIL — ' + fails + ' check(s)'); document.title = 'FAIL'; return; }
    const bytes = new Uint8Array(await blob.arrayBuffer());
    let w = null, wErr = null;
    try { w = G.verifyBundle3(bytes); } catch (e) { wErr = e; }
    ok('verifyBundle3 walks the bake it just wrote', !wErr, wErr ? String(wErr.message).slice(0, 140) : '');
    let plate = null, hands = [], prevRows = [];
    if (w && w.sections.length) {
      const els = w.sections[0].blob.elements;
      for (let i = 0; i < els.length; i++) {
        const e = els[i], k = e.cls !== undefined ? e.cls : e.class;
        // CLASS_PLATE is 3, not 0: class 0 is TEXT, so the line this replaces looked for a
        // row no clock bake writes and reported the plate's frame count as 0 on every green
        // bake. The dial's own plate is slot 0; a glass overlay rides the same class at a
        // higher slot, and it is the one the author can raise.
        if (k === 3 && !(e.slot & 0xffff)) plate = e;
        // D42: every hand, shadow and carriage is a moving row (class 8, AUX); class 2 is refused.
        if (k === 8) hands.push('' + (e.slot | 0));
        if (k === 9) prevRows.push(e);
      }
    }
    const nf = plate ? (plate.n_frames | 0) : 0;
    say('reader: plate row n_frames=' + nf + '  row slots [' + hands.join(',') + ']  bytes ' + bytes.length);
    if (w && w.sections.length) {
      const els3 = w.sections[0].blob.elements;
      const st3 = els3.filter((e) => (e.cls !== undefined ? e.cls : e.class) === 8 && e.src === 0 && !(e.flags & 16));   // a shadow twin is source 0 too
      say('still rows: ' + st3.length + st3.map((e) => ' [' + e.w + 'x' + e.h + ' at ' + e.x + ',' + e.y + ' depth ' + e.order + ']').join('') +
          '  hands at depth ' + els3.filter((e) => (e.cls !== undefined ? e.cls : e.class) === 8 && e.src !== 0).map((e) => e.order).join(',') +
          '  windows at depth ' + els3.filter((e) => (e.cls !== undefined ? e.cls : e.class) === 5).map((e) => e.order).join(','));
    }
    ok('the plate row carries the frames the carrier promised', nf >= 2 || /still|shimmer band|rides the still/.test(st), 'n_frames ' + nf);
    ok('every centre hand rode the bake as its own v6 row', hands.length >= 2, hands.join(','));
    // One preview row, opaque, square, at half the panel — the plane the OS picker and the
    // hub's Themes card paint. A theme that cannot picture itself is an unfinished export,
    // and this is the trip that says so at the bake rather than three doors down.
    ok('the bake carries one preview row', prevRows.length === 1, prevRows.length + ' class 9 rows');
    if (prevRows.length === 1) {
      const pv = prevRows[0];
      ok('the preview row is one opaque square, the whole glass (§60)', pv.n_frames === 1 && pv.w === pv.h && pv.w === 466,
         pv.w + 'x' + pv.h + ' x' + pv.n_frames);
    }
    let bin = '', CH = 8192;
    for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    say('B64LEN ' + bytes.length);
    say('B64:' + btoa(bin));
    if (plate8) {
      let pb = '';
      for (let i = 0; i < plate8.rgba.length; i += CH) pb += String.fromCharCode.apply(null, plate8.rgba.subarray(i, i + CH));
      say('PLATE8 ' + plate8.w + 'x' + plate8.h);
      say('PLATE64:' + btoa(pb));
    }
    say(fails ? 'RESULT: FAIL — ' + fails + ' check(s)' : 'RESULT: PASS');
    document.title = fails ? 'FAIL' : 'PASS';
  }
  main().catch((e) => { say('RESULT: FAIL — ' + (e && e.message)); say(String((e && e.stack) || '').split('\n').slice(0, 7).join('\n')); document.title = 'FAIL'; });
})();
</script>
