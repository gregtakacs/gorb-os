<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<!-- The hosted theme editor (theme-editor-kit-plan §8): Orb Manager's page, served at the
     app's /editor/<ip>/<slug>/ so the app's own files load beside it. The hub writes the
     runtime the app's editor.json lists and the app's module into this template. -->
<link rel="stylesheet" href="/runtime/ui@1/ui.css">
<link rel="stylesheet" href="/runtime/studio@1/studio.css">
<link rel="stylesheet" href="/runtime/fonts@1/fonts.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
  .hs-list { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; }
  .hs-view { display: inline-flex; align-items: center; gap: 6px; }
  .st-tool + .st-tool { padding-top: 0; }
  .hs-size { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .hs-size b { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
  .hs-size.hs-over { border-color: #f85149; color: #f85149; }
  .hs-pace { display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .hs-pace > .ui-mut { flex-basis: 100%; }
  .hs-pace i { font-style: normal; color: var(--mut); }
</style>
</head>
<body>
<div id="root"></div>
<script src="orb-app.js"></script>
<script src="/runtime/react@18.3.1/react.production.min.js"></script>
<script src="/runtime/react@18.3.1/react-dom.production.min.js"></script>
<script src="/runtime/baker@1/orbtheme-baker.js"></script>
{{range .Extras}}<script src="{{.}}"></script>
{{end}}<script src="/runtime/theme@1/send.js"></script>
<script src="/runtime/theme@1/session.js"></script>
<script src="/runtime/theme@1/preview.js"></script>
<script src="/runtime/theme@1/measure.js"></script>
<script src="/runtime/studio@1/studio.js"></script>
<script src="/runtime/host@1/host.js"></script>
{{range .Modules}}<script src="{{.}}"></script>
{{end}}</body>
</html>
