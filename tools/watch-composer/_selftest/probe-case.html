<!doctype html>
<meta charset="utf-8">
<title>case-probe</title>
<body><pre id="out">booting…</pre>
<script src="../dial-renderer.js"></script>
<script src="../watch-engine.js"></script>
<script>window.React = { createRef: () => ({ current: null }) };</script>
<script src="component.js"></script>
<script>
(function () {
  const out = document.getElementById('out'), L = [];
  const say = (s) => { L.push(s); out.textContent = L.join('\n'); };
  const DCLogic = function () { };
  DCLogic.prototype.setState = function (p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); };
  const S4 = 466, C4 = 233;
  const E = window.WatchEngine;
  const it = new (window.COMP_CLASS(DCLogic))({});
  it.ready = true; it.rendering = false;
  it.state.dial = 'modern'; it.state.timeMode = 'pose'; it.state.frame = 0; it.state.hidden = {};
  it.state.tab = 'export'; it.state.playing = false; it.budget = () => ({ fps: 8 });
  // an "imported image with its own case already on it": solid red across the whole panel,
  // so any black that survives out there was painted by the composer and not by the image.
  const src = document.createElement('canvas'); src.width = S4; src.height = S4;
  const sx = src.getContext('2d');
  sx.fillStyle = '#ff0044'; sx.fillRect(0, 0, S4, S4);
  E.assetRestore([{ id: 'probe-case', name: 'case.png', kind: 'png', dataUrl: src.toDataURL('image/png') }]);
  setTimeout(() => {
    try { body(); } catch (e) { say('THREW ' + (e && e.message) + ' || ' + String((e && e.stack) || '').split('\n').slice(0, 4).join(' | ')); }
  }, 80);
  function body() {
    if (!E.assetReady('probe-case')) { say('asset not ready'); return; }
    const base = { print: 'none', numerals: 'none', comps: [], centre: { hour: 1, minute: 1, second: 0 } };
    it.faceOf = (patch, opts) => {
      if (opts) Object.assign(it.state, opts);
      it.state.designs = { modern: E.canonDesign(Object.assign(JSON.parse(JSON.stringify(base)), patch)) };
      it.faces = {};
      return it.face();
    };
    const ART = { sfArt: 'probe-case', sfSize: 466, sfX: 0, sfY: 0, sfFit: 'stretch' };
    const shot = (opts, hideOuter) => {
      const fc = it.faceOf(ART, opts);
      const c = document.createElement('canvas'); c.width = S4; c.height = S4;
      const hid = { movement: 1, geartrain: 1, complications: 1, subdials: 1, hands: 1, glass: 1, outer: hideOuter ? 1 : 0 };
      E.compose(c.getContext('2d'), it.base, it.gt[0], fc, new Date(2026, 0, 1, 10, 9, 0), hid);
      return c.getContext('2d').getImageData(0, 0, S4, S4).data;
    };
    const px = (d, x, y) => { const i = (y * S4 + x) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]].join(','); };
    const pts = [[233, 233], [233, 60], [233, 12], [12, 12], [454, 454]];
    for (const op of [233, 221.5, 150]) {
      const a = shot({ caseStyle: 'none', caseOpen: op }, false), b = shot({ caseStyle: 'none', caseOpen: op }, true);
      let redShown = 0, redHidden = 0, blackShownRing = 0;
      for (let y = 0; y < S4; y++) for (let x = 0; x < S4; x++) {
        const i = (y * S4 + x) * 4, rr = Math.hypot(x - C4, y - C4);
        if (a[i] > 190 && a[i + 1] < 90 && a[i + 2] < 90 && a[i + 3] > 200) redShown++;
        if (b[i] > 190 && b[i + 1] < 90 && b[i + 2] < 90 && b[i + 3] > 200) redHidden++;
        if (rr > 150 && a[i] < 12 && a[i + 1] < 12 && a[i + 2] < 12 && a[i + 3] > 250) blackShownRing++;
      }
      say('none open=' + op + ' redShown=' + redShown + ' redHidden=' + redHidden + ' blackRingPx=' + blackShownRing
        + ' | ' + pts.map((p) => p + '->' + px(a, p[0], p[1]) + '/' + px(b, p[0], p[1])).join(' | '));
    }
    const g = E.caseLayer({ caseStyle: 'none', caseOpen: 150, outerTemp: 2200, outerHue: 0, outerSat: 0 }).getContext('2d');
    say('caseLayer none alpha: ' + pts.map((p) => p + '->' + g.getImageData(p[0], p[1], 1, 1).data[3]).join(' | '));
    const p = E.caseLayer({ caseStyle: 'polished', caseOpen: 221.5, outerTemp: 2200, outerHue: 0, outerSat: 0 }).getContext('2d');
    say('caseLayer polished corner alpha: ' + [[6, 6], [460, 460], [233, 233]].map((q) => q + '->' + p.getImageData(q[0], q[1], 1, 1).data[3]).join(' | '));
    document.title = 'DONE';
  }
})();
</script>
